<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<title>BLACK BUSINESS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Цвет акцента и фона меняется в зависимости от локации (data-loc на body) */
:root{--bg:#0b1118;--p:#141e2a;--l:#263648;--t:#eaf0f6;--m:#8fa1b5;--a:#8b7bd8;--g:#1a2440}
body[data-loc=city]{--a:#8b7bd8;--g:#2a2058}
body[data-loc=mine]{--a:#3fd1b0;--g:#0c3b3a}
body[data-loc=shop]{--a:#e0607e;--g:#401a2c}
body[data-loc=work]{--a:#5aa7e8;--g:#12304f}
body[data-loc=biz]{--a:#e0a458;--g:#3a2a12}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 70% at 50% 0,var(--g),var(--bg) 70%) fixed var(--bg);color:var(--t);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;padding-bottom:84px}
button{font:inherit;color:var(--t);cursor:pointer}
header{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:10px 12px;position:sticky;top:0;z-index:5;background:rgba(11,17,24,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--l)}
header h1{font-size:16px;text-align:center;letter-spacing:.06em}
#back{background:none;border:0;color:var(--a);text-align:left;font-size:14px;visibility:hidden}
#st{font-size:10.5px;color:var(--m);text-align:right}
main{max-width:640px;margin:auto;padding:14px}
h2{font-size:15px;margin:14px 0 8px}
.btn{background:var(--a);color:#07101a;border:0;border-radius:10px;padding:9px 13px;font-weight:700;white-space:nowrap}
.btn:disabled{opacity:.4}
.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sm{color:var(--m);font-size:12.5px}
.bar{height:6px;background:#0008;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--a)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:6px 12px;font-size:13px}
.chip.on{border-color:var(--a);color:var(--a)}.chip:disabled{opacity:.4}
.stage{display:grid;grid-template-columns:76px 1fr 76px;gap:8px;align-items:center;min-height:calc(100vh - 190px)}
.rail{display:flex;flex-direction:column;gap:8px}
.rail button{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:9px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rail b{font-size:20px;font-weight:400}
.hero{text-align:center}
.hero svg{width:100%;max-width:240px;filter:drop-shadow(0 14px 16px #000a)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:linear-gradient(160deg,var(--c),#0f1722 78%);border:1px solid var(--l);border-radius:14px;padding:14px 11px;text-align:left;min-height:98px}
.scene{position:relative;height:300px;border-radius:16px;border:1px solid var(--l);overflow:hidden;margin-bottom:10px;background:radial-gradient(60% 50% at 25% 20%,#3fd1b033,transparent),radial-gradient(50% 60% at 80% 85%,#5aa7e826,transparent),linear-gradient(#0d1f26,#06090d)}
.vein{position:absolute;width:48px;height:48px;border:0;border-radius:50%;background:radial-gradient(circle,var(--vc),#0000 70%);box-shadow:0 0 20px var(--vc);animation:pulse 2.4s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.vein{animation:none}}
button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,17,24,.92);backdrop-filter:blur(10px);border-top:1px solid var(--l);font-size:14px;z-index:6}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#000d;border:1px solid var(--l);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;font-size:13px;text-align:center}
</style>
</head>
<body data-loc="home">
<header><button id="back" onclick="go('home')">← Назад</button><h1 id="ttl">BLACK BUSINESS</h1><div id="st">…</div></header>
<main id="v"></main>
<nav id="bar"><span>🪙 <b id="bc"></b></span><span>⚡ <b id="be"></b></span><span>Ур. <b id="bl"></b></span><button class="btn" onclick="go('home')">Главная</button></nav>
<div id="toast" role="status"></div>

<script>
/* =========================================================
   ПОДКЛЮЧЕНИЕ К SUPABASE И TELEGRAM
   Существующие подключения сохранены без изменений.
   Функции telegram-auth и game-state вызываются как раньше.
   ========================================================= */
const SUPABASE_URL="https://lcutewtfifmrqmpzjjth.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Pw418XOzxvsbT8A_YDdMqQ_OdL4EUvG";
const sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const tg=window.Telegram?.WebApp;

/* =========================================================
   КАТАЛОГИ ПРОТОТИПА (временные тестовые данные, этап 2)
   Позже заменяются данными с сервера без переделки интерфейса.
   ========================================================= */
/* Руды: [название, цена продажи, цвет жилы] */
const ORE={coal:["Уголь",3,"#7b8794"],iron:["Железная руда",8,"#b08968"],copper:["Медная руда",12,"#e07a3f"],silver:["Серебро",30,"#cfd8e3"],gold:["Золото",80,"#f0c14b"],crystal:["Кристалл",200,"#7be0ff"]};
/* Участки шахты: разная сложность и ценность. lv — нужный уровень, en — цена добычи в энергии, w — веса руд */
const ZONES=[
 {id:"z1",n:"Штольня",lv:1,en:2,w:{coal:50,iron:30,copper:20}},
 {id:"z2",n:"Глубокий забой",lv:3,en:4,w:{iron:25,copper:30,silver:30,gold:15}},
 {id:"z3",n:"Кристальная пещера",lv:5,en:6,w:{silver:30,gold:35,crystal:35}}];
/* Предметы: s — слот, p — цена, c — цвет на персонаже, b — бонус кирки */
const SL={head:"Голова",body:"Торс",legs:"Ноги",feet:"Обувь",acc:"Аксессуар",back:"Спина",tool:"Инструмент"};
const ITEMS=[
 {id:"cap",n:"Кепка",s:"head",p:150,c:"#e0607e",r:"Обычный"},
 {id:"helmet",n:"Шахтёрская каска",s:"head",p:400,c:"#e0a458",r:"Необычный"},
 {id:"jacket",n:"Синяя куртка",s:"body",p:300,c:"#3b6fb6",r:"Обычный"},
 {id:"vest",n:"Рабочий жилет",s:"body",p:350,c:"#d9702f",r:"Необычный"},
 {id:"cargo",n:"Рабочие брюки",s:"legs",p:250,c:"#5b6b3a",r:"Обычный"},
 {id:"boots",n:"Ботинки",s:"feet",p:300,c:"#6b4a2f",r:"Обычный"},
 {id:"glasses",n:"Очки",s:"acc",p:200,c:"#111",r:"Обычный"},
 {id:"bag",n:"Рюкзак",s:"back",p:500,c:"#7a4ad8",r:"Редкий"},
 {id:"pick2",n:"Железная кирка",s:"tool",p:600,b:1,r:"Необычный"},
 {id:"pick3",n:"Серебряная кирка",s:"tool",p:3000,b:2,r:"Редкий"}];
/* Бизнесы: p — цена, i — доход в час за уровень */
const BIZ=[{id:"kiosk",n:"Киоск",p:2000,i:20},{id:"work",n:"Мастерская",p:8000,i:90},{id:"depot",n:"Склад",p:25000,i:300}];
/* Задания шахтёра: k — что считаем, need — сколько нужно, r — награда */
const TASKS=[
 {id:"t1",n:"Добыть 10 единиц руды",k:"mined",need:10,r:200},
 {id:"t2",n:"Добыть 50 единиц руды",k:"mined",need:50,r:900},
 {id:"t3",n:"Купить любую вещь",k:"bought",need:1,r:150},
 {id:"t4",n:"Продать руды на 200 монет",k:"sold",need:200,r:300},
 {id:"t5",n:"Дорасти до 3 уровня",k:"lv",need:3,r:500}];
/* Профессии: связаны цепочкой (шахтёр → металлург → завод → механик) */
const PROF=[
 ["Шахтёр","Добывает руду для металлургов",1],["Фотограф","Заказы на фото через Mini App",3],
 ["Металлург","Перерабатывает руду в металл",4],["Фермер","Выращивает продукцию для магазинов",5],
 ["Механик","Чинит транспорт деталями завода",6],["Водитель","Доставляет товары между игроками",7]];
/* Разделы-заготовки: интерфейс есть, механика будет добавлена позже */
const STUB={
 estate:["Недвижимость","Покупка и аренда жилья, склады, аукцион недвижимости."],
 factory:["Завод","Переработка руды в металл и детали. Зависит от шахтёров."],
 farm:["Ферма","Фермеры выращивают продукцию для магазинов и водителей."],
 market:["Торговая площадка","Торговля между игроками и аукционы."]};

/* =========================================================
   СОСТОЯНИЕ ПРОТОТИПА
   Хранится только на этом устройстве (localStorage).
   Серверный баланс и прогресс не используются.
   ========================================================= */
const KEY="bb_proto_v1";
const def=()=>({coins:1000,energy:100,xp:0,lv:1,ore:{},found:{},own:[],eq:{},biz:{},bizT:Date.now(),zone:"z1",st:{mined:0,bought:0,sold:0},claimed:[]});
function load(){try{return Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return def()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),cur="home",pname="Игрок",veins=[],lastMsg="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>Number(n).toLocaleString("ru-RU");
const item=id=>ITEMS.find(x=>x.id===id);
let tmr;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.opacity=1;clearTimeout(tmr);tmr=setTimeout(()=>t.style.opacity=0,2200)}
/* Опыт: порог растёт с уровнем */
const xpNeed=()=>80+40*S.lv;
function gain(x){S.xp+=x;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.lv++;toast("Новый уровень: "+S.lv)}}

/* =========================================================
   НАВИГАЦИЯ И ОТРИСОВКА
   Один контейнер #v, каждый раздел — функция в объекте R.
   ========================================================= */
const R={};
const TT={home:"Персонаж",city:"Город",mine:"Шахта",work:"Профессии",tasks:"Задания",shop:"Магазин",inv:"Инвентарь",ward:"Гардероб",biz:"Бизнес",ach:"Достижения",col:"Коллекции"};
const LOC={home:"home",city:"city",mine:"mine",work:"work",tasks:"work",shop:"shop",biz:"biz",inv:"home",ward:"home",ach:"home",col:"home"};
function go(p){cur=p;if(p==="mine")newVeins();draw();scrollTo(0,0)}
function draw(){
  document.body.dataset.loc=LOC[cur]||"home";
  document.getElementById("ttl").textContent=TT[cur]||"BLACK BUSINESS";
  document.getElementById("back").style.visibility=cur==="home"?"hidden":"visible";
  document.getElementById("v").innerHTML=(R[cur]||R.home)();
  document.getElementById("bc").textContent=num(S.coins);
  document.getElementById("be").textContent=S.energy+"/100";
  document.getElementById("bl").textContent=S.lv;
}
Object.keys(STUB).forEach(k=>{TT[k]=STUB[k][0];LOC[k]="city";R[k]=()=>`<div class="card"><b>${STUB[k][0]}</b><p class="sm">${STUB[k][1]}</p><p class="sm">Раздел в разработке.</p></div>`});

/* =========================================================
   ГЛАВНЫЙ ЭКРАН И ПЕРСОНАЖ
   Персонаж по центру, навигация слева и справа, баланс внизу.
   Одежда из гардероба меняет внешний вид (пока 2D-схема;
   3D-модель требует отдельной проработки для Mini App).
   ========================================================= */
const LEFT=[["inv","🎒","Инвентарь"],["ward","👕","Гардероб"],["ach","🏆","Достижения"],["col","💎","Коллекции"]];
const RIGHT=[["city","🏙","Город"],["work","⛏","Профессии"],["tasks","📋","Задания"],["biz","💼","Бизнес"],["shop","🛍","Магазин"],["estate","🏠","Недвижимость"]];
const rail=a=>a.map(b=>`<button onclick="go('${b[0]}')"><b>${b[1]}</b>${b[2]}</button>`).join("");
function hero(){
  const c=k=>{const i=item(S.eq[k]);return i&&i.c};
  const body=c("body")||"#4a5a70",legs=c("legs")||"#2c3a52",feet=c("feet")||"#1b1f27",head=c("head"),back=c("back"),acc=c("acc");
  return `<svg viewBox="0 0 120 230" role="img" aria-label="Персонаж">
  <ellipse cx="60" cy="222" rx="46" ry="6" fill="#0009"/>
  ${back?`<rect x="30" y="62" width="60" height="70" rx="12" fill="${back}"/>`:""}
  <rect x="38" y="120" width="19" height="86" rx="8" fill="${legs}"/><rect x="63" y="120" width="19" height="86" rx="8" fill="${legs}"/>
  <rect x="34" y="204" width="26" height="14" rx="6" fill="${feet}"/><rect x="60" y="204" width="26" height="14" rx="6" fill="${feet}"/>
  <rect x="18" y="66" width="16" height="58" rx="8" fill="${body}"/><rect x="86" y="66" width="16" height="58" rx="8" fill="${body}"/>
  <rect x="32" y="62" width="56" height="64" rx="16" fill="${body}"/>
  <circle cx="60" cy="38" r="22" fill="#e0b48f"/><path d="M38 34a22 22 0 0144 0c-8-8-36-8-44 0z" fill="#2a1f1a"/>
  <circle cx="53" cy="43" r="2" fill="#2a1f1a"/><circle cx="67" cy="43" r="2" fill="#2a1f1a"/>
  ${acc?`<rect x="45" y="38" width="14" height="9" rx="3" fill="none" stroke="#111" stroke-width="2"/><rect x="61" y="38" width="14" height="9" rx="3" fill="none" stroke="#111" stroke-width="2"/>`:""}
  ${head?`<path d="M36 32a24 24 0 0148 0z" fill="${head}"/><rect x="32" y="30" width="56" height="5" rx="2" fill="${head}"/>`:""}
  ${S.eq.head==="helmet"?`<circle cx="60" cy="14" r="4" fill="#fff6c8"/>`:""}
  </svg>`;
}
R.home=()=>`<div class="stage"><div class="rail">${rail(LEFT)}</div><div class="hero">${hero()}<div><b>${esc(pname)}</b></div><div class="sm">Опыт ${S.xp}/${xpNeed()}</div><div class="bar"><i style="width:${Math.min(100,S.xp/xpNeed()*100)}%"></i></div></div><div class="rail">${rail(RIGHT)}</div></div>`;

/* =========================================================
   ГОРОД
   Интерактивные объекты ведут в игровые разделы.
   ========================================================= */
R.city=()=>`<div class="grid">${[["mine","Шахта","Руда и минералы","#0f4a47"],["shop","Магазин","Одежда и инструменты","#5a1d36"],["biz","Бизнес","Пассивный доход","#5a4018"],["work","Профессии","Работа и развитие","#17406a"],["factory","Завод","Скоро","#33295f"],["farm","Ферма","Скоро","#2f4a24"],["market","Торговая площадка","Скоро","#4a3a2a"],["estate","Недвижимость","Скоро","#2d3a52"]].map(b=>`<button class="tile" style="--c:${b[3]}" onclick="go('${b[0]}')"><b>${b[1]}</b><div class="sm">${b[2]}</div></button>`).join("")}</div>`;

/* =========================================================
   СИСТЕМА ШАХТЫ
   Участки с разной ценностью, энергия за добычу, шанс двойной
   добычи и редкой находки зависят от кирки. Расчёт пока
   локальный; на сервере его заменит проверяемая операция.
   ========================================================= */
const pick=w=>{let t=Object.values(w).reduce((a,b)=>a+b,0)*Math.random();for(const k in w){t-=w[k];if(t<=0)return k}return Object.keys(w)[0]};
const zone=()=>ZONES.find(x=>x.id===S.zone);
const newVein=()=>({o:pick(zone().w),x:8+Math.random()*74,y:8+Math.random()*70});
function newVeins(){veins=[0,1,2,3,4].map(newVein)}
function setZone(id){S.zone=id;newVeins();save();draw()}
function mineVein(i){
  const z=zone();
  if(S.energy<z.en)return toast("Недостаточно энергии. Отдохни.");
  S.energy-=z.en;
  const o=veins[i].o,t=item(S.eq.tool),b=t?t.b:0;
  const n=1+(Math.random()<.2+.1*b?1:0);
  S.ore[o]=(S.ore[o]||0)+n;S.found[o]=1;S.st.mined+=n;gain(2+z.lv);
  lastMsg=`+${n} ${ORE[o][0]}`;
  if(Math.random()<.03+.02*b){S.ore.crystal=(S.ore.crystal||0)+1;S.found.crystal=1;S.st.mined++;lastMsg+=" · редкая находка: кристалл!"}
  veins[i]=newVein();save();draw();
}
function rest(){if(S.coins<20)return toast("Недостаточно монет");S.coins-=20;S.energy=Math.min(100,S.energy+30);save();draw()}
R.mine=()=>`<div class="chips">${ZONES.map(x=>`<button class="chip${x.id===S.zone?" on":""}" ${S.lv<x.lv?"disabled":""} onclick="setZone('${x.id}')">${x.n}${S.lv<x.lv?" · ур. "+x.lv:""}</button>`).join("")}</div>
<div class="scene">${veins.map((v,i)=>`<button class="vein" aria-label="${ORE[v.o][0]}" style="--vc:${ORE[v.o][2]};left:${v.x}%;top:${v.y}%" onclick="mineVein(${i})"></button>`).join("")}</div>
<div class="card row"><div><b>${lastMsg||"Нажми на светящуюся жилу"}</b><div class="sm">Энергия за добычу: ${zone().en}</div></div><button class="btn" onclick="rest()">Отдых +30 · 20 🪙</button></div>`;
/* Энергия восстанавливается со временем (1 единица в 8 секунд) */
setInterval(()=>{if(S.energy<100){S.energy++;document.getElementById("be").textContent=S.energy+"/100";save()}},8000);

/* =========================================================
   ПРОФЕССИИ И ЗАДАНИЯ
   Профессии связаны между собой: игроки зависят друг от друга.
   ========================================================= */
R.work=()=>PROF.map((p,i)=>`<div class="card row"><div><b>${p[0]}</b><div class="sm">${p[1]}</div></div>${i===0?`<button class="btn" onclick="go('mine')">В шахту</button>`:`<span class="sm">Ур. ${p[2]} · скоро</span>`}</div>`).join("");
const prog=t=>t.k==="lv"?S.lv:S.st[t.k];
function claim(id){const t=TASKS.find(x=>x.id===id);if(S.claimed.includes(id)||prog(t)<t.need)return;S.claimed.push(id);S.coins+=t.r;toast("Награда: +"+t.r+" 🪙");save();draw()}
R.tasks=()=>TASKS.map(t=>{const p=Math.min(prog(t),t.need),d=S.claimed.includes(t.id);return `<div class="card"><div class="row"><div><b>${t.n}</b><div class="sm">${p}/${t.need} · награда ${t.r} 🪙</div></div><button class="btn" ${d||p<t.need?"disabled":""} onclick="claim('${t.id}')">${d?"Получено":"Забрать"}</button></div><div class="bar"><i style="width:${p/t.need*100}%"></i></div></div>`}).join("");

/* =========================================================
   МАГАЗИН
   Покупка предметов и скупка руды. Проверки цены и наличия.
   ========================================================= */
function buy(id){
  const i=item(id);
  if(S.own.includes(id))return;
  if(S.coins<i.p)return toast("Недостаточно монет");
  S.coins-=i.p;S.own.push(id);S.st.bought++;
  if(!S.eq[i.s])S.eq[i.s]=id;
  toast("Куплено: "+i.n);save();draw();
}
function sellOre(o){const n=S.ore[o]||0;if(!n)return;const s=n*ORE[o][1];S.coins+=s;S.st.sold+=s;S.ore[o]=0;toast("Продано: +"+s+" 🪙");save();draw()}
R.shop=()=>{
  const ores=Object.keys(ORE).filter(o=>S.ore[o]>0);
  return `<h2>Скупка руды</h2>${ores.length?ores.map(o=>`<div class="card row"><div><b>${ORE[o][0]} × ${S.ore[o]}</b><div class="sm">${ORE[o][1]} 🪙 за штуку</div></div><button class="btn" onclick="sellOre('${o}')">+${S.ore[o]*ORE[o][1]} 🪙</button></div>`).join(""):`<div class="card sm">Руды нет. Добудь её в шахте.</div>`}
  <h2>Одежда и инструменты</h2>${ITEMS.map(i=>`<div class="card row"><div><b>${i.n}</b><div class="sm">${i.r} · ${SL[i.s]}</div></div>${S.own.includes(i.id)?`<span class="sm">Куплено</span>`:`<button class="btn" onclick="buy('${i.id}')">${i.p} 🪙</button>`}</div>`).join("")}`;
};

/* =========================================================
   ИНВЕНТАРЬ И ГАРДЕРОБ
   Надетые предметы меняют внешний вид персонажа.
   ========================================================= */
function equip(id){const i=item(id);if(S.eq[i.s]===id)delete S.eq[i.s];else S.eq[i.s]=id;save();draw()}
function resetAll(){if(confirm("Сбросить тестовые данные прототипа?")){S=def();save();go("home")}}
R.inv=()=>{
  const ores=Object.keys(ORE).filter(o=>S.ore[o]>0),tools=ITEMS.filter(i=>i.s==="tool"&&S.own.includes(i.id));
  return `<h2>Материалы</h2>${ores.length?ores.map(o=>`<div class="card row"><b>${ORE[o][0]}</b><span>${S.ore[o]}</span></div>`).join(""):`<div class="card sm">Инвентарь пока пуст.</div>`}
  <h2>Инструменты</h2><div class="card row"><b>Обычная кирка</b><span class="sm">${S.eq.tool?"":"Надета"}</span></div>
  ${tools.map(i=>`<div class="card row"><b>${i.n}</b><button class="btn" onclick="equip('${i.id}')">${S.eq.tool===i.id?"Снять":"Надеть"}</button></div>`).join("")}
  <p class="sm" style="margin-top:14px">Тестовые данные хранятся только на этом устройстве.</p><button class="chip" onclick="resetAll()">Сбросить прототип</button>`;
};
R.ward=()=>{
  const own=ITEMS.filter(i=>i.s!=="tool"&&S.own.includes(i.id));
  return `<div class="hero" style="margin-bottom:10px">${hero()}</div>${own.length?own.map(i=>`<div class="card row"><div><b>${i.n}</b><div class="sm">${SL[i.s]} · ${i.r}</div></div><button class="btn" onclick="equip('${i.id}')">${S.eq[i.s]===i.id?"Снять":"Надеть"}</button></div>`).join(""):`<div class="card sm">Гардероб пуст. Загляни в магазин.</div>`}`;
};

/* =========================================================
   БИЗНЕС
   Пассивный доход копится до 12 часов и забирается вручную.
   Улучшение: цена = цена бизнеса × уровень × 0.75, максимум 10.
   ========================================================= */
const rate=()=>BIZ.reduce((s,b)=>s+(S.biz[b.id]||0)*b.i,0);
const pend=()=>Math.floor(rate()*Math.min(Date.now()-S.bizT,43200000)/3600000);
function collect(){S.coins+=pend();S.bizT=Date.now()}
function bizBuy(id){
  const b=BIZ.find(x=>x.id===id),lv=S.biz[id]||0,cost=lv?Math.round(b.p*lv*.75):b.p;
  if(lv>=10)return;
  collect();
  if(S.coins<cost)return toast("Недостаточно монет");
  S.coins-=cost;S.biz[id]=lv+1;save();draw();
}
function take(){collect();save();draw()}
R.biz=()=>`<div class="card row"><div><b>Накоплено: ${num(pend())} 🪙</b><div class="sm">Доход: ${num(rate())} в час</div></div><button class="btn" ${pend()<1?"disabled":""} onclick="take()">Забрать</button></div>
${BIZ.map(b=>{const lv=S.biz[b.id]||0,cost=lv?Math.round(b.p*lv*.75):b.p;return `<div class="card row"><div><b>${b.n}${lv?" · ур. "+lv:""}</b><div class="sm">${b.i} 🪙/час за уровень</div></div><button class="btn" ${lv>=10?"disabled":""} onclick="bizBuy('${b.id}')">${lv>=10?"Максимум":(lv?"Улучшить ":"Купить ")+num(cost)}</button></div>`}).join("")}`;

/* =========================================================
   ДОСТИЖЕНИЯ И КОЛЛЕКЦИИ
   ========================================================= */
R.ach=()=>[["Первая руда",S.st.mined>=1],["Добыто 50 единиц руды",S.st.mined>=50],["Первая покупка",S.st.bought>=1],["Третий уровень",S.lv>=3],["Владелец бизнеса",Object.keys(S.biz).length>0]].map(a=>`<div class="card row"><b>${a[0]}</b><span class="sm">${a[1]?"Получено":"Не получено"}</span></div>`).join("");
R.col=()=>`<h2>Найденные руды</h2>${Object.keys(ORE).map(o=>`<div class="card row"><b>${S.found[o]?ORE[o][0]:"???"}</b><span class="sm">${S.found[o]?"Найдено":"Не найдено"}</span></div>`).join("")}<h2>Одежда</h2><div class="card">Собрано предметов: ${S.own.length} из ${ITEMS.length}</div>`;

/* =========================================================
   ЗАПУСК И АВТОРИЗАЦИЯ
   Проверка Telegram и профиль — через существующие функции.
   Если сервер недоступен, прототип продолжает работать локально.
   ========================================================= */
async function startGame(){
  tg?.ready();tg?.expand();
  draw();
  const st=document.getElementById("st"),initData=tg?.initData;
  if(!initData){st.textContent="Вне Telegram";return}
  try{
    st.textContent="Вход…";
    const a=await sbClient.functions.invoke("telegram-auth",{body:{initData}});
    if(a.error)throw a.error;
    if(a.data?.error)throw new Error(a.data.error);
    const g=await sbClient.functions.invoke("game-state",{body:{initData}});
    if(g.error)throw g.error;
    if(g.data?.error)throw new Error(g.data.error);
    pname=g.data?.player?.display_name||tg?.initDataUnsafe?.user?.first_name||"Игрок";
    st.textContent="Сервер подключён";
  }catch(e){
    console.error(e);
    pname=tg?.initDataUnsafe?.user?.first_name||"Игрок";
    st.textContent="Сервер недоступен";
  }
  draw();
}
startGame();
</script>
