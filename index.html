const KEY="bb_proto_v1";
const def=()=>({coins:1000,energy:100,xp:0,lv:1,ore:{},found:{},own:[],eq:{},biz:{},bizT:Date.now(),zone:"z1",st:{mined:0,bought:0,sold:0},claimed:[],mats:{},log:[],pass:0,daily:0,streak:0,proj:0,props:{},frag:0,jobs:0,farm:[null,null,null],dl:{}});

const num=n=>Number(n).toLocaleString("ru-RU");

let tmr;function toast(m){S.log.unshift(new Date().toLocaleTimeString("ru-RU").slice(0,5)+" "+m);S.log.length=Math.min(S.log.length,40);const t=document.getElementById("toast");t.textContent=m;t.style.opacity=1;clearTimeout(tmr);tmr=setTimeout(()=>t.style.opacity=0,2200)}

const pick=w=>{let t=Object.values(w).reduce((a,b)=>a+b,0)*Math.random();for(const k in w){t-=w[k];if(t<=0)return k}return Object.keys(w)[0]};
const zone=()=>ZONES.find(x=>x.id===S.zone);
const newVein=()=>({o:pick(zone().w),x:8+Math.random()*74,y:8+Math.random()*70,sp:Math.random()<.07});
function newVeins(){veins=[0,1,2,3,4].map(newVein)}
function setZone(id){S.zone=id;newVeins();save();draw()}
function mineVein(i){
  const z=zone();
  if(S.energy<ec(z))return toast("Недостаточно энергии. Отдохни.");
  S.energy-=ec(z);
  const o=veins[i].o,b=toolB(),sp=veins[i].sp;wear();
  const n=(1+(Math.random()<.2+.1*b+(S.eq.back?.1:0)?1:0))*(sp?3:1);
  S.ore[o]=(S.ore[o]||0)+n;S.found[o]=1;S.st.mined+=n;gain(2+z.lv);
  lastMsg=`+${n} ${ORE[o][0]}`;
  if(Math.random()<.03+.02*b+Math.min(.04,.01*(plv("mine")-1))+Math.min(.1,eqPerk("rare"))){S.ore.crystal=(S.ore.crystal||0)+1;S.found.crystal=1;S.st.mined++;lastMsg+=" · редкая находка: кристалл!"}
  if(sp)lastMsg+=" · особое месторождение ×3!";if(Math.random()<.04){addRel(0);lastMsg+=" · найден древний предмет (раздел «Исследователь»)"}veins[i]=newVein();save();draw();
}
function rest(){if(S.coins<20)return toast("Недостаточно монет");S.coins-=20;S.energy=Math.min(100,S.energy+30);save();draw()}
R.mine=()=>{
  const z=zone();
  return `<div class="chips">${ZONES.map(x=>`<button class="chip${x.id===S.zone?" on":""}" ${S.lv<x.lv?"disabled":""} onclick="setZone('${x.id}')">${x.n}${S.lv<x.lv?" · ур. "+x.lv:""}</button>`).join("")}</div>
<div class="scene" style="background-image:linear-gradient(rgba(0,0,0,0.25),rgba(0,0,0,0.6)),url('${z.bg}');">
  ${veins.map((v,i)=>`<button class="vein${v.sp?" sp":""}" aria-label="${ORE[v.o][0]}" style="--vc:${ORE[v.o][2]};left:${v.x}%;top:${v.y}%" onclick="mineVein(${i})"><img src="${ORE[v.o][3]}" alt="${ORE[v.o][0]}"></button>`).join("")}
</div>
<div class="card row"><div><b>${lastMsg||"Нажми на светящуюся жилу"}</b><div class="sm">Энергия за добычу: ${z.en}</div></div><button class="btn" onclick="rest()">Отдых +30 · 20 🪙</button></div>`;
};

function claim(id){const t=TASKS.find(x=>x.id===id);if(S.claimed.includes(id)||prog(t)<t.need)return;S.claimed.push(id);S.coins+=t.r;toast("Награда: +"+t.r+" 🪙");save();draw()}

/* =========================================================

function buy(id){
  const i=item(id);
  if(S.own.includes(id))return;
  if(S.coins<pr(i))return toast("Недостаточно монет");
  S.coins-=pr(i);S.own.push(id);S.st.bought++;
  if(!S.eq[i.s])S.eq[i.s]=id;
  toast("Куплено: "+i.n);save();draw();
}
function sellOre(o){const n=S.ore[o]||0;if(!n)return;const s=Math.round(n*ORE[o][1]*mk(o)*pm());S.coins+=s;S.st.sold+=s;S.ore[o]=0;toast("Продано: +"+s+" 🪙");save();draw()}
R.shop=()=>{
  const ores=Object.keys(ORE).filter(o=>S.ore[o]>0);
  return `<h2>Скупка руды</h2>${ores.length?ores.map(o=>`<div class="card row"><div style="display:flex;align-items:center;gap:12px"><img class="ore-ico" src="${ORE[o][3]}" alt=""><div><b>${ORE[o][0]} × ${S.ore[o]}</b><div class="sm">${Math.round(ORE[o][1]*mk(o)*pm())} 🪙 за штуку</div></div></div><button class="btn" onclick="sellOre('${o}')">+${Math.round(S.ore[o]*ORE[o][1]*mk(o)*pm())} 🪙</button></div>`).join(""):`<div class="card sm">Руды нет. Добудь её в шахте.</div>`}
  <h2>Одежда и инструменты</h2>${ITEMS.filter(i=>!i.co&&(!i.se||i.se===SEAS()[0])).map(i=>`<div class="card row"><div class="ir">${ico(i)}<div><b>${i.n}</b><div class="sm">${i.r} · ${SL[i.s]}</div></div></div>${S.own.includes(i.id)?`<span class="sm">Куплено</span>`:`<button class="btn" onclick="buy('${i.id}')">${pr(i)} 🪙</button>`}</div>`).join("")}`;
};

function equip(id){const i=item(id);if(S.eq[i.s]===id)delete S.eq[i.s];else S.eq[i.s]=id;save();draw()}
function resetAll(){if(confirm("Сбросить тестовые данные прототипа?")){S=def();save();go("home")}}

  const ores=Object.keys(ORE).filter(o=>S.ore[o]>0),tools=ITEMS.filter(i=>i.s==="tool"&&S.own.includes(i.id));
  return `<h2>Материалы</h2>${ores.length?ores.map(o=>`<div class="card row"><div style="display:flex;align-items:center;gap:12px"><img class="ore-ico" src="${ORE[o][3]}" alt=""><b>${ORE[o][0]}</b></div><span>${S.ore[o]}</span></div>`).join(""):`<div class="card sm">Инвентарь пока пуст.</div>`}
  ${Object.keys(MAT).filter(k=>S.mats[k]>0).map(k=>`<div class="card row"><b>${MAT[k][0]}</b><span>${S.mats[k]}</span></div>`).join("")}<h2>Инструменты</h2><div class="card row"><b>Обычная кирка</b><span class="sm">${S.eq.tool?"":"Надета"}</span></div>
  ${tools.map(i=>`<div class="card row"><b>${i.n}</b><button class="btn" onclick="equip('${i.id}')">${S.eq.tool===i.id?"Снять":"Надеть"}</button></div>`).join("")}

/* =========================================================
   БИЗНЕС
   ========================================================= */
const rate=()=>Math.round(BIZ.reduce((s,b)=>s+bnet(b),0)+PROP.reduce((s,b)=>s+(S.props[b.id]?b.i*(S.tn&&S.tn[b.id]?1.3:1):0),0));
const pend=()=>Math.floor(rate()*Math.min(Date.now()-S.bizT,43200000)/3600000);
function collect(){S.coins+=pend();const h=Math.min(Date.now()-S.bizT,43200000)/36e5;S.bs=S.bs||{};BIZ.forEach(b=>{if(S.biz[b.id])S.bs[b.id]=Math.max(0,(S.bs[b.id]||0)-h*S.biz[b.id])});S.bizT=Date.now()}
function bizBuy(id){
  const b=BIZ.find(x=>x.id===id),lv=S.biz[id]||0,cost=lv?Math.round(b.p*lv*.75):b.p;
  if(lv>=10)return;
  collect();
  if(S.coins<cost)return toast("Недостаточно монет");
  S.coins-=cost;S.biz[id]=lv+1;save();draw();
}
function take(){collect();save();draw()}
R.biz=()=>`<div class="card row"><div><b>Накоплено: ${num(pend())} 🪙</b><div class="sm">Доход: ${num(rate())} в час</div></div><button class="btn" ${pend()<1?"disabled":""} onclick="take()">Забрать</button></div>
${BIZ.map(b=>{const lv=S.biz[b.id]||0,cost=lv?Math.round(b.p*lv*.75):b.p;return `<div class="card row"><div><b>${b.n}${lv?" · ур. "+lv:""}</b><div class="sm">${b.i} 🪙/час за уровень</div></div><button class="btn" ${lv>=10?"disabled":""} onclick="bizBuy('${b.id}')">${lv>=10?"Максимум":(lv?"Улучшить ":"Купить ")+num(cost)}</button></div>`}).join("")}`;

setInterval(()=>{Object.keys(MKT).forEach(o=>MKT[o]=Math.min(1.5,Math.max(.6,MKT[o]+(Math.random()-.5)*.2)));if(cur==="market")draw()},30000);

const MAT={iron_bar:["Железный слиток",30],copper_bar:["Медный слиток",45],silver_bar:["Серебряный слиток",110],part:["Деталь",160],jewel:["Украшение",600]};
const REC=[
 {n:"Железный слиток",i:{iron:3,coal:1},o:"iron_bar",en:3},

 {n:"Серебряный слиток",i:{silver:2,coal:2},o:"silver_bar",en:4},
 {n:"Деталь",i:{iron_bar:2,copper_bar:1},o:"part",en:5},

function craft(i){
  const r=REC[i];

  <h2>Ваши предметы</h2>${S.own.length?S.own.map(id=>{const i=item(id);return `<div class="card row"><div><b>${i.n}</b><div class="sm">${i.r}</div></div><button class="chip" onclick="dis('${id}')">Разобрать</button><button class="btn" onclick="sellItem('${id}')">Продать ${Math.round(i.p*.6)} 🪙</button></div>`}).join(""):`<div class="card sm">Предметов нет.</div>`}`;

/* =========================================================
   ОБЪЕДИНЕНИЕ ПРЕДМЕТОВ И ПОВЫШЕНИЕ РЕДКОСТИ
   3 неэкипированных предмета одной редкости → случайный новый
   предмет следующей редкости.
   ========================================================= */
const RAR=["Обычный","Необычный","Редкий","Эпический","Легендарный"];
function merge(r){
  const k=RAR.indexOf(r),h=ITEMS.filter(i=>i.r===r&&S.own.includes(i.id)&&S.eq[i.s]!==i.id);
  if(h.length<3)return toast("Нужно 3 неэкипированных предмета");
  const pool=ITEMS.filter(i=>i.r===RAR[k+1]&&!S.own.includes(i.id));
  if(!pool.length)return toast("Нет новых предметов выше редкостью");
  const out=h.slice(0,3).map(i=>i.id);S.own=S.own.filter(x=>!out.includes(x));
  const n=pool[Math.floor(Math.random()*pool.length)];S.own.push(n.id);toast("Объединение: получен "+n.n);save();draw();
}
const _cases=R.cases;
R.cases=()=>_cases()+`<h2>Объединение предметов</h2>`+RAR.slice(0,4).map(r=>`<div class="card row"><div><b>5 × ${r}</b><div class="sm">→ предмет редкостью выше</div></div><button class="btn" onclick="merge('${r}')">Объединить</button></div>`).join("");

 head:`<path d="M6 24a14 14 0 0128 0z" fill="${c}"/><rect x="3" y="23" width="34" height="5" rx="2" fill="${c}"/>`,

/* =========================================================

/* =========================================================
   ТОРГОВЛЯ МЕЖДУ ИГРОКАМИ
   Лоты с выбором цены (быстро / по рынку / дорого), комиссия 5%,

   Реальные покупатели и проверка — на стороне сервера.

const FEE=.05,L=()=>S.lst||(S.lst=[]);
function list(o,m){const n=S.ore[o]||0;if(!n)return;S.ore[o]=0;L().push({o,n,m,at:Date.now(),t:m<1?8e3:m>1?3e4:15e3});toast("Лот выставлен: "+ORE[o][0]+" ×"+n);save();draw()}
function settle(){let c=0;S.lst=L().filter(x=>{if(Date.now()-x.at<x.t)return true;const g=Math.round(x.n*ORE[x.o][1]*x.m*mk(x.o)*(1-FEE));S.coins+=g;inc("sold",g);toast(`Сделка: ${ORE[x.o][0]} ×${x.n} → +${g} 🪙 (комиссия 5%)`);c++;return false});if(c){save();draw()}}
setInterval(()=>{if(L().length)settle()},3000);
const DEALS=[{g:{iron:5},r:{copper:3}},{g:{copper:4},r:{silver:1}},{g:{silver:3},r:{gold:1}},{g:{coal:8},r:{iron:3}}];
function deal(i){const d=DEALS[i],k="d"+i;if(S.dl[k]===day())return toast("Сделка на сегодня выполнена");if(!Object.keys(d.g).every(o=>have(o)>=d.g[o]))return toast("Не хватает руды");Object.keys(d.g).forEach(o=>S.ore[o]-=d.g[o]);Object.keys(d.r).forEach(o=>{S.ore[o]=(S.ore[o]||0)+d.r[o];S.found[o]=1});S.dl[k]=day();toast("Обмен выполнен: "+Object.keys(d.g).map(o=>nm(o)+" ×"+d.g[o]).join(", ")+" → "+Object.keys(d.r).map(o=>nm(o)+" ×"+d.r[o]).join(", "));save();draw()}
const ds=x=>Object.keys(x).map(o=>nm(o)+" ×"+x[o]).join(", ");
R.trade=()=>`<h2>Мои лоты</h2>${L().length?L().map(x=>`<div class="card sm">${ORE[x.o][0]} ×${x.n} · цена ×${x.m} · продаётся…</div>`).join(""):`<div class="card sm">Лотов нет.</div>`}
<h2>Выставить на рынок (комиссия 5%)</h2>${Object.keys(ORE).filter(o=>S.ore[o]>0).map(o=>`<div class="card"><b>${ORE[o][0]} × ${S.ore[o]}</b><div class="chips" style="margin:8px 0 0"><button class="chip" onclick="list('${o}',.9)">Быстро −10%</button><button class="chip" onclick="list('${o}',1)">По рынку</button><button class="chip" onclick="list('${o}',1.1)">Дорого +10%</button></div></div>`).join("")||`<div class="card sm">Нет руды для продажи.</div>`}
<h2>Обмен с торговцем</h2>${DEALS.map((d,i)=>`<div class="card row"><div><b>${ds(d.g)} → ${ds(d.r)}</b></div><button class="btn" ${S.dl["d"+i]===day()?"disabled":""} onclick="deal(${i})">${S.dl["d"+i]===day()?"Сделано":"Обменять"}</button></div>`).join("")}
<h2>История сделок</h2>${S.log.filter(l=>/Сделка|Обмен/.test(l)).slice(0,6).map(l=>`<div class="card sm">${esc(l)}</div>`).join("")||`<div class="card sm">Сделок пока нет.</div>`}`;

/* =========================================================
   СЕРВЕРНОЕ ПРЕДПРИЯТИЕ: ГОРОДСКАЯ АРТЕЛЬ

/* =========================================================
   ПРОФЕССИЯ РЫБАКА
   Заброс (⚡2) → ожидание поклёвки → вовремя подсечь (1,2 с).
   Слишком раннее подсекание пугает рыбу. Улов идёт на склад

Object.assign(MAT,{carp:["Карась",20],pike:["Щука",55],gcarp:["Золотой карп",200]});
const fs={st:0,tm:0};
function fishAct(){
  if(fs.st===0){

    S.energy-=2;fs.st=1;
    fs.tm=setTimeout(()=>{fs.st=2;if(cur==="fish")draw();fs.tm=setTimeout(()=>{if(fs.st===2){fs.st=0;toast("Рыба сорвалась");if(cur==="fish")draw()}},1200)},1200+Math.random()*2500);
  }else if(fs.st===1){clearTimeout(fs.tm);fs.st=0;toast("Слишком рано — рыба ушла")}

  draw();
}

   Для заказа нужны товары разных профессий (металлург, фермер,

const BO={iron_bar:5,wheat:5,board:3,part:1};

const spot=()=>day()%3;

const _ev4=R.events;
R.events=()=>_ev4()+`<h2>Большой совместный заказ</h2><div class="card"><div class="sm">Нужны товары разных профессий. Награда: 1500 🪙 и 10 фрагментов.</div>${Object.keys(BO).map(k=>`<div class="row" style="margin-top:8px"><span>${nm(k)} ${bo()[k]||0}/${BO[k]}</span><button class="chip" ${(bo()[k]||0)>=BO[k]?"disabled":""} onclick="boGive('${k}')">Сдать 1</button></div>`).join("")}</div><h2>Поиск сокровищ</h2><div class="card"><div class="sm">Раз в сутки проверь одно из трёх мест.</div><div class="chips" style="margin:8px 0 0">${["Старая шахта","Берег озера","Лесная поляна"].map((n,i)=>`<button class="chip" ${S.tr===day()?"disabled":""} onclick="dig(${i})">${n}</button>`).join("")}</div></div>`;

/* =========================================================
   КАЛЕНДАРЬ СОБЫТИЙ

const SEAS=()=>{const m=new Date().getMonth();return m===11||m<1?["Новый год","Праздничные ярмарки и подарки"]:m<5?["Весна","Пора посадок и ярмарок"]:m<8?["Лето","Сезон рыбалки и фестивалей"]:["Осень","Время урожая и осенних лотов"]};
const hm=ms=>new Date(ms).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});

/* =========================================================
   СОВМЕСТНАЯ ЭКСПЕДИЦИЯ В ШАХТУ
   Отряд из вас и двух напарников уходит на 20 секунд (⚡10)
   на выбранный участок шахты и приносит в 1,5 раза больше руды.
   ========================================================= */
const EXP_T=2e4;
function expGo(){if(S.ex)return;if(S.energy<10)return toast("Нужно 10 энергии");S.energy-=10;S.ex={z:S.zone,at:Date.now()};toast("Отряд ушёл: "+zone().n);save();draw()}
function expTake(){
  const e=S.ex;if(!e||Date.now()-e.at<EXP_T)return;
  const z=ZONES.find(x=>x.id===e.z),r={};let n=0;
  for(let i=0;i<12;i++){const o=pick(z.w);r[o]=(r[o]||0)+1;n++}
  Object.keys(r).forEach(o=>{S.ore[o]=(S.ore[o]||0)+r[o];S.found[o]=1});
  inc("mined",n);gain(10);S.ex=null;toast("Экспедиция вернулась: "+Object.keys(r).map(o=>ORE[o][0]+" ×"+r[o]).join(", "));save();draw();
}
setInterval(()=>{if(cur==="exp")draw()},1000);
R.exp=()=>{const e=S.ex,left=e?Math.max(0,Math.ceil((EXP_T-(Date.now()-e.at))/1000)):0;
  return `<div class="card"><b>Совместная экспедиция</b><p class="sm">С вами идут два напарника: добыча в 1,5 раза больше обычной. Участок: ${zone().n}. Цена: ⚡10.</p>${e?`<div class="bar"><i style="width:${100-left/(EXP_T/1000)*100}%"></i></div><button class="btn" style="margin-top:10px" ${left?"disabled":""} onclick="expTake()">${left?"Возвращаются через "+left+" с":"Забрать добычу"}</button>`:`<button class="btn" style="margin-top:10px" onclick="expGo()">Отправить отряд</button>`}</div>`};

   центральную — 2 урона, промах тратит энергию впустую. Три удачных

const TREES=[{n:"Сосна",hp:4,w:2,e:"🌲"},{n:"Дуб",hp:6,w:4,e:"🌳"},{n:"Берёза",hp:3,w:2,e:"🌳",f:"hue-rotate(40deg) brightness(1.35)"}];
let tr=null,wst=0;
function newTree(){const k=Math.random(),t=TREES[k<.5?0:k<.8?1:2];tr={t,hp:t.hp,fall:0,fx:"",n:0}}
const mpos=()=>50+50*Math.sin(performance.now()/330);
function strike(){
  if(!tr)newTree();
  if(tr.fall)return;
  if(S.energy<2)return toast("Недостаточно энергии");
  S.energy-=2;
  const d=Math.abs(mpos()-tc),q=d<=7?"p":d<=18?"g":"m",dmg=q==="p"?2:q==="g"?1:0;
  if(q==="m")wst=0;else wst++;
  tr.hp-=dmg;tr.fx=q;tr.n++;tc=22+Math.random()*56;
  setTimeout(()=>{if(tr)tr.fx=""},500);
  if(dmg)gain(1);
  if(tr.hp<=0){
    const w=tr.t.w+(wst>=3?1:0)+(plv("wood")>=3?1:0);
    S.mats.wood=(S.mats.wood||0)+w;let m="Срублено: +"+w+" бревна";
    if(tr.t.hp>=6&&Math.random()<.2){S.mats.resin=(S.mats.resin||0)+1;m+=" и смола"}
    inc("chopped",w);gain(5);toast(m);tr.fall=1;
    setTimeout(()=>{newTree();if(cur==="wood")draw()},1000);
  }
  save();draw();
}

   Выберите семена и нажимайте на пустую грядку (посев). Лейка
   ускоряет рост на 25% и даёт +1 к урожаю. Сорняки появляются
   сами: если не выдернуть за 10 секунд, урожай уменьшится.
   Растения проходят стадии роста; готовые светятся и просятся в сбор.

const FD=6,CE={wheat:"🌾",veg:"🥕",flax:"🌸"};
const fd=()=>(S.fd&&S.fd.length===FD)?S.fd:(S.fd=Array(FD).fill(null));
let ft="wheat",fxp=null,fsig="";
const gp=p=>Math.min(1,(Date.now()-p.at)/(CROPS.find(c=>c.id===p.c).t*1000*(p.w?.75:1)));
function fTool(k){ft=k;draw()}
function fTap(i){
  const f=fd(),p=f[i];
  if(p&&p.wd){p.wd=0;if(Date.now()-p.ws>1e4)p.pen=1;fxp={i,k:"weed"};gain(1);toast("Сорняк выдернут")}
  else if(!p){
    if(ft==="water")return toast("Сначала посейте семена");
    const c=CROPS.find(x=>x.id===ft);if(S.coins<c.c)return toast("Недостаточно монет");
    S.coins-=c.c;f[i]={c:ft,at:Date.now(),w:0,wd:0,pen:0};fxp={i,k:"seed"};
  }
  else if(gp(p)>=1){
    const n=Math.max(1,3+(p.w?1:0)-(p.pen?1:0));
    S.mats[p.c]=(S.mats[p.c]||0)+n;inc("harvested",n);gain(4);fxp={i,k:"pick",e:CE[p.c]};f[i]=null;toast("Собрано: "+MAT[p.c][0]+" ×"+n);
  }
  else if(ft==="water"&&!p.w){p.w=1;fxp={i,k:"water"};toast("Полито: рост быстрее, урожай больше")}
  else return;
  setTimeout(()=>{fxp=null},700);save();draw();
}

/* =========================================================
   ЛЕСОРУБ 2.0: ДИНАМИЧЕСКАЯ ЗОНА ПОПАДАНИЯ (по файлу «Работы»)
   Классическая механика сохранена — режим переключается в игре.
   Динамика: зона «дышит» и плывёт по шкале, ширина и скорость
   зависят от породы дерева и уровня профессии.
   ========================================================= */
(function(){
  const _rw=R.wood, _st=strike;
  TREES.forEach(t=>{t.d=t.hp>=6?"normal":"soft"});
  TREES.push({n:"Ясень",hp:7,w:5,e:"🌳",f:"hue-rotate(-35deg) saturate(1.3)",d:"hard"});
  TREES.push({n:"Тис",hp:9,w:7,e:"🌲",f:"hue-rotate(130deg) brightness(.8)",d:"rare"});
  const DIF={
    soft:{l:"Мягкая древесина",gw:20,pw:9,per:380,amp:0,br:.12},
    normal:{l:"Обычная древесина",gw:15,pw:6.5,per:320,amp:12,br:.28},
    hard:{l:"Твёрдая древесина",gw:11,pw:4.5,per:260,amp:22,br:.34},
    rare:{l:"Редкая порода",gw:8,pw:3.2,per:220,amp:30,br:.4}
  };
  const lvl=()=>{try{return plv("wood")||0}catch(e){return 0}};
  newTree=function(){
    const L=lvl(),k=Math.random();
    let pool=TREES.filter(t=>t.d==="soft"||t.d==="normal");
    if(L>=2&&k>.7)pool=TREES.filter(t=>t.d==="hard");
    if(L>=4&&k>.93)pool=TREES.filter(t=>t.d==="rare");
    const t=pool[Math.floor(Math.random()*pool.length)];
    tr={t,hp:t.hp,fall:0,fx:"",n:0,ph:Math.random()*6.28,ph2:Math.random()*6.28};
  };
  function prm(){
    const d=DIF[tr.t.d||"normal"],L=lvl(),w=1+Math.min(.2,L*.02),s=1+Math.min(.15,L*.015);
    return {gw:d.gw*w,pw:d.pw*w,per:d.per*s,amp:d.amp,br:d.br};
  }
  function zone(){
    const p=prm(),t=performance.now(),k=1+p.br*Math.sin(t/1100+tr.ph);
    const c=50+p.amp*Math.sin(t/1700+tr.ph2)*(tr.n?1:.4);
    return {c:Math.max(p.gw,Math.min(100-p.gw,c)),gw:p.gw*k,pw:p.pw*k,per:p.per};
  }
  const mp=()=>{const z=tr?zone():{per:320};return 50+50*Math.sin(performance.now()/z.per)};
  const dyn=()=>S.ljm!=="classic";
  window.ljMode=m=>{S.ljm=m;save();draw()};
  strike=function(){
    if(!dyn())return _st();
    if(!tr)newTree();
    if(tr.fall)return;
    if(S.energy<2)return toast("Недостаточно энергии");
    S.energy-=2;
    const z=zone(),d=Math.abs(mp()-z.c),q=d<=z.pw?"p":d<=z.gw?"g":"m",dmg=q==="p"?2:q==="g"?1:0;
    if(q==="m")wst=0;else wst++;
    tr.hp-=dmg;tr.fx=q;tr.n++;tr.ph=Math.random()*6.28;tr.ph2=Math.random()*6.28;
    S.lj=S.lj||{p:0,g:0,m:0};S.lj[q]++;
    setTimeout(()=>{if(tr)tr.fx=""},500);
    if(dmg)gain(q==="p"?2:1);
    if(tr.hp<=0){
      const w=tr.t.w+(wst>=3?1:0)+(lvl()>=3?1:0);
      S.mats.wood=(S.mats.wood||0)+w;let m="Срублено: +"+w+" бревна";
      if(tr.t.hp>=6&&Math.random()<.2){S.mats.resin=(S.mats.resin||0)+1;m+=" и смола"}
      inc("chopped",w);gain(5+(tr.t.d==="rare"?5:tr.t.d==="hard"?2:0));toast(m);tr.fall=1;
      setTimeout(()=>{newTree();if(cur==="wood")draw()},1000);
    }
    if(navigator.vibrate)try{navigator.vibrate(q==="p"?30:q==="g"?15:5)}catch(e){}
    save();draw();
  };
  R.wood=function(){
    let h=_rw();
    if(typeof h!=="string"||h.indexOf('class="gauge"')<0)return h;
    const z=tr?zone():{c:50,gw:15,pw:6};
    const mode=`<div class="chips" style="margin-bottom:8px"><button class="chip${dyn()?"":" on"}" onclick="ljMode('classic')">Классика</button><button class="chip${dyn()?" on":""}" onclick="ljMode('dyn')">Динамика</button></div>`;
    if(!dyn())return mode+h;
    const p=S.lj||{p:0,g:0,m:0},tot=p.p+p.g+p.m,acc=tot?Math.round((p.p+p.g)/tot*100):0;
    const gauge=`<div class="gauge"><i class="gz" id="dzg" style="left:${z.c-z.gw}%;width:${z.gw*2}%"></i><i class="gz p" id="dzp" style="left:${z.c-z.pw}%;width:${z.pw*2}%"></i><i id="mk"></i></div>`;
    h=h.replace(/<div class="gauge">[\s\S]*?<\/i><\/div>/,gauge);
    h=h.replace(/<p class="sm" style="margin-top:8px">[\s\S]*$/,`<p class="sm" style="margin-top:8px">${DIF[tr.t.d||"normal"].l}: зона меняет ширину и положение, маркер ускоряется на твёрдых породах. Точность: ${acc}% · идеальных ударов: ${p.p}. Брёвна: ${S.mats.wood||0}, доски: ${S.mats.board||0}, смола: ${S.mats.resin||0}.</p>`);
    return mode+h;
  };
  (function tick2(){
    if(typeof tr!=="undefined"&&tr&&cur==="wood"&&dyn()){
      const m=document.getElementById("mk"),g=document.getElementById("dzg"),p=document.getElementById("dzp");
      if(m&&g&&p){const z=zone();m.style.left=mp()+"%";
        g.style.left=(z.c-z.gw)+"%";g.style.width=(z.gw*2)+"%";
        p.style.left=(z.c-z.pw)+"%";p.style.width=(z.pw*2)+"%"}
    }
    requestAnimationFrame(tick2);
  })();
})();
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';

const activeScenes = new WeakMap();
function mountCharacter(host) {
  if (activeScenes.has(host)) return;
  const width = Math.max(180, host.clientWidth || 240);
  const height = Math.max(240, host.clientHeight || 300);
  const scene = new THREE.Scene();
  scene.background = null;
  const camera = new THREE.PerspectiveCamera(30, width / height, 0.1, 100);
  camera.position.set(0, 1.35, 4.4);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(width, height);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  host.replaceChildren(renderer.domElement);
  host.classList.remove('loading', 'error');
  scene.add(new THREE.HemisphereLight(0xffffff, 0x526078, 2.1));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
  const fill = new THREE.DirectionalLight(0x8b7bd8, 0.8); fill.position.set(-3, 2, -2); scene.add(fill);
  const loader = new GLTFLoader();
  loader.load('./player.glb', (gltf) => {
    const model = gltf.scene;
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    model.position.x -= center.x;
    model.position.y -= box.min.y;
    model.position.z -= center.z;
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = 2.45 / maxDim;
    model.scale.setScalar(scale);
    const scaledHeight = size.y * scale;
    camera.position.set(0, Math.max(1.1, scaledHeight * 0.55), Math.max(3.4, scaledHeight * 1.8));
    camera.lookAt(0, scaledHeight * 0.48, 0);
    let mixer = null;
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      const clips = gltf.animations;
      const idle = clips.find(c => /idle|stand|wait/i.test(c.name)) || clips[0];
      mixer.clipAction(idle).play();
    }
    const clock = new THREE.Clock();
    let frame = 0;
    const render = () => {
      if (!host.isConnected) { renderer.dispose(); return; }
      frame = requestAnimationFrame(render);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (mixer) mixer.update(dt);
      renderer.render(scene, camera);
    };
    render();
    activeScenes.set(host, { renderer, frame });
  }, undefined, (err) => {
    console.error('Не удалось загрузить ./player.glb', err);
    host.classList.add('error');
  });
}
function scanCharacters() {
  document.querySelectorAll('[data-player-model="1"]').forEach(mountCharacter);
}
new MutationObserver(scanCharacters).observe(document.getElementById('v'), { childList: true, subtree: true });
scanCharacters();
window.addEventListener('resize', () => {
  document.querySelectorAll('[data-player-model="1"] canvas').forEach(canvas => {
    const host = canvas.parentElement;
    const renderer = activeScenes.get(host)?.renderer;
    if (renderer) renderer.setSize(Math.max(180, host.clientWidth), Math.max(240, host.clientHeight));
  });
});
</script>
